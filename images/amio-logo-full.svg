<svg xmlns="http://www.w3.org/2000/svg" width="400" height="480" viewBox="0 0 400 480" role="img">
  <title>amio coffee</title>
  <desc>Map Pin Logo mit Kaffeetasse und Schriftzug – amio coffee</desc>

  <!-- Hintergrund -->
  <rect width="400" height="480" rx="20" fill="#DCD7C9"/>

  <!-- Pin Schatten -->
  <ellipse cx="200" cy="298" rx="32" ry="8" fill="#2C3639" opacity="0.12"/>

  <!-- Pin Kreis -->
  <circle cx="200" cy="160" r="80" fill="#A27B5C"/>
  <!-- Pin Spitze -->
  <path d="M162 222 Q162 278 200 298 Q238 278 238 222 Z" fill="#A27B5C"/>

  <!-- Innerer Kreis -->
  <circle cx="200" cy="160" r="62" fill="#3F4E4F"/>

  <!-- Tasse -->
  <rect x="172" y="143" width="58" height="34" rx="6" fill="#DCD7C9"/>
  <!-- Tassenrand -->
  <rect x="172" y="143" width="58" height="7" rx="3" fill="#A27B5C" opacity="0.4"/>
  <!-- Henkel -->
  <path d="M230 149 Q248 149 248 160 Q248 171 230 171" fill="none" stroke="#DCD7C9" stroke-width="5.5" stroke-linecap="round"/>
  <!-- Untertasse -->
  <ellipse cx="200" cy="179" rx="34" ry="6" fill="#DCD7C9" opacity="0.55"/>
  <ellipse cx="200" cy="179" rx="34" ry="6" fill="none" stroke="#A27B5C" stroke-width="1" opacity="0.35"/>

  <!-- Dampf -->
  <path d="M184 141 Q178 127 184 113 Q190 99 184 85" fill="none" stroke="#DCD7C9" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M200 139 Q194 124 200 109 Q206 94 200 79" fill="none" stroke="#DCD7C9" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <path d="M216 141 Q210 127 216 113 Q222 99 216 85" fill="none" stroke="#DCD7C9" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Schriftzug amio -->
  <text x="200" y="362"
    font-family="Georgia, serif"
    font-size="64"
    font-weight="700"
    fill="#2C3639"
    text-anchor="middle"
    letter-spacing="5">amio</text>

  <!-- Trennlinie -->
  <line x1="80" y1="380" x2="320" y2="380" stroke="#A27B5C" stroke-width="1" opacity="0.4"/>

  <!-- Subtext COFFEE -->
  <text x="200" y="410"
    font-family="Georgia, serif"
    font-size="18"
    fill="#A27B5C"
    text-anchor="middle"
    letter-spacing="12">COFFEE</text>
</svg>
