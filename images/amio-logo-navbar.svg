  <path d="M50 31 Q48 26 50 21" fill="none" stroke="#DCD7C9" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  <path d="M56 32 Q54 27 56 22" fill="none" stroke="#DCD7C9" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
